version: '3.8'

services:
  # Frontend - Vue.js/Quasar
  frontend:
    build:
      context: .
      dockerfile: ../FrontEnd/Dockerfile
    container_name: biuai-frontend
    ports:
      - "8080:80"
    environment:
      NODE_ENV: production
      VITE_API_URL: http://localhost:8000/api/v1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend - FastAPI
  backend:
    build: 
      context: ../BackEnd
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      POSTGRES_SERVER: db
      POSTGRES_USER: biuai
      POSTGRES_PASSWORD: biuai123
      POSTGRES_DB: biuai
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-mysecretkey}
      FIRST_SUPERUSER: admin@biuai.com
      FIRST_SUPERUSER_PASSWORD: admin123
      BACKEND_CORS_ORIGINS: '["http://localhost:8080", "http://127.0.0.1:8080"]'
      SMTP_TLS: "true"
      SMTP_PORT: 587
      SMTP_HOST: ${SMTP_HOST:-""}
      SMTP_USER: ${SMTP_USER:-""}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-""}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL:-""}
      SENTRY_DSN: ${SENTRY_DSN:-""}
      MCP_MEMORY_SERVICE_URL: ${MCP_MEMORY_SERVICE_URL:-""}
      MCP_CHATBOT_SERVICE_URL: ${MCP_CHATBOT_SERVICE_URL:-""}
      OLLAMA_BASE_URL: http://ollama:11434
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
      - ./modules:/app/modules
      - backend_logs:/app/logs
      - ./scripts:/app/scripts
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  # PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: biuai
      POSTGRES_PASSWORD: biuai123
      POSTGRES_DB: biuai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biuai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Jupyter Notebook
  jupyter:
    build: ./jupyter
    volumes:
      - ./jupyter/notebooks:/notebooks
      - ./data:/data
    ports:
      - "8888:8888"
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token=''
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MCP Memory Service
  mcp-memory-service:
    build: ./mcp-memory-service
    container_name: biuai-memory-service
    volumes:
      - ./mcp-memory-service:/app
      - ./data:/app/data
    ports:
      - "8001:8001"
    environment:
      DEBUG: "true"
      DATA_DIR: /app/data
      MCP_SERVER_HOST: "0.0.0.0"
      MCP_SERVER_PORT: "8001"
      MEM0_API_KEY: "${MEM0_API_KEY:-default_key_for_development}"
      MEM0_PROFILE: "${MEM0_PROFILE:-biuai_development}"
      MEM0_SERVER_URL: "${MEM0_SERVER_URL:-http://localhost:8001}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MCP Chatbot Service
  mcp-chatbot-service:
    build: ./mcp-chatbot-service
    container_name: biuai-chatbot
    volumes:
      - ./mcp-chatbot-service:/app
      - ./data:/app/data
    ports:
      - "8002:8002"
    environment:
      DEBUG: "true"
      OLLAMA_BASE_URL: http://ollama:11434
      BOT_NAME: "Bi UAI Bot Administrador"
      DATA_DIR: /app/data
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama - IA Local Simplificada
  ollama:
    image: ollama/ollama:latest
    container_name: biuai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_ORIGINS=*
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

  # ML Service
  ml-service:
    build: ./ml_service
    container_name: biuai-ml-service
    volumes:
      - ./ml_service:/app
      - ./data:/app/data
    ports:
      - "8003:8003"
    environment:
      DEBUG: "true"
      MODEL_PATH: /app/models
      DATA_DIR: /app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ETL Service
  etl-service:
    build: ./etl_service
    container_name: biuai-etl-service
    volumes:
      - ./etl_service:/app
      - ./data:/app/data
    environment:
      DEBUG: "true"
      DATA_DIR: /app/data
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    name: biuai-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  mcp_memory_data:
  chatbot_data:
  backend_logs: 
